<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#0E2A25;color:#F3EDD3;font-family:'Montserrat',Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
body::before{content:'';position:absolute;left:50%;top:50%;width:min(120vmin,900px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(210,168,92,.16),transparent 66%)}
body::after{content:'';position:absolute;inset:clamp(14px,2.4vw,26px);border:1px solid rgba(210,168,92,.22);pointer-events:none}
main{position:relative;max-width:520px}
.logo{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:22px;letter-spacing:.42em;margin-right:-.42em;color:#F3EDD3}
.logo b{color:#D2A85C;font-weight:500}
.num{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(90px,20vw,150px);line-height:1;color:transparent;-webkit-text-stroke:1px rgba(210,168,92,.6);margin:40px 0 6px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(30px,5vw,40px);line-height:1.15}
h1 em{font-style:italic;color:#E8C886}
p{margin-top:16px;font-size:14.5px;line-height:1.75;color:#B4C3BC}
.ctas{margin-top:34px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.mbtn{display:inline-block;padding:1.5px;border-radius:999px;background:linear-gradient(to bottom,#8A6A2F,#EAD98F);box-shadow:0 3px 10px rgba(0,0,0,.25);text-decoration:none}
.mbtn span{display:flex;align-items:center;justify-content:center;padding:14px 32px;border-radius:999px;background:linear-gradient(to bottom,#EED9A4,#C49A55 55%,#A87F3F);color:#221806;font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;letter-spacing:2.4px;text-transform:uppercase;font-weight:600}
.gbtn{display:inline-flex;align-items:center;padding:14px 28px;border-radius:999px;border:1px solid rgba(243,237,211,.5);color:#F3EDD3;text-decoration:none;font-size:11px;letter-spacing:2.2px;text-transform:uppercase;font-weight:600}
.gbtn:hover{border-color:#D2A85C;color:#D2A85C}
</style>
</head>
<body>
<main>
  <div class="logo">LEBEN<b>.</b></div>
  <div class="num">404</div>
  <h1>Esta página saiu da <em>vitrine</em>.</h1>
  <p>O endereço pode ter mudado. O catálogo completo e o nosso WhatsApp continuam a um toque.</p>
  <div class="ctas">
    <a class="mbtn" href="/catalogo"><span>Ver catálogo</span></a>
    <a class="gbtn" href="/">Ir para o início</a>
  </div>
</main>
</body>
